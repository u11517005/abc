function renderCards(filterLetter = 'ALL') {

const filtered = filterLetter === 'ALL'
? lexiconData

const card = document.createElement('article');

function filterCards(letter, clickedBtn) {
document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
if (clickedBtn) {
clickedBtn.classList.add('active');
} else {
document.querySelector('.all-btn').classList.add('active');
}
renderCards(letter);
}
function speakText(text) {
if (!('speechSynthesis' in window)) {
alert('您的瀏覽器不支援語音朗讀功能。');
return;
}
window.speechSynthesis.cancel();
const utterance = new SpeechSynthesisUtterance(text);
const voices = window.speechSynthesis.getVoices();
const ukVoice = voices.find(v => v.lang.includes('en-GB')) || voices.find(v => v.lang.includes('en'));
if (ukVoice) utterance.voice = ukVoice;
utterance.lang = 'en-GB';
utterance.rate = 0.88;
window.speechSynthesis.speak(utterance);
}
window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
renderCards();
