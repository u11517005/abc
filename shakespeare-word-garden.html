  <style>
    :root {
      --bg-paper: #F6F1E7;
      --bg-card: #EFE8D8;
      --ink-primary: #1F1C18;
      --ink-secondary: #5C5346;
      --accent-crimson: #7B241C;
      --accent-gold: #A67C37;
      --border-line: #D4C8B4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-paper);
      color: var(--ink-primary);
      font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
      line-height: 1.7;
      background-image: radial-gradient(rgba(166, 124, 55, 0.08) 1px, transparent 0);
      background-size: 24px 24px;
    }

    /* Header */
    header {
      text-align: center;
      padding: 4rem 1.5rem 2.5rem;
      border-bottom: 1px solid var(--border-line);
      max-width: 1100px;
      margin: 0 auto;
    }

    .subtitle-top {
      font-size: 0.9rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--ink-primary);
      margin-bottom: 0.8rem;
    }

    .intro-text {
      max-width: 640px;
      margin: 0 auto;
      font-size: 1.1rem;
      color: var(--ink-secondary);
    }

    /* Alphabet Nav */
    .alpha-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(246, 241, 231, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-line);
      padding: 0.9rem 1rem;
    }

    .alpha-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.35rem;
    }

    .alpha-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--ink-secondary);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 700;
      width: 32px;
      height: 32px;
      cursor: pointer;
      border-radius: 50%;
      transition: all 0.25s ease;
    }

    .alpha-btn:hover,
    .alpha-btn.active {
      background: var(--accent-crimson);
      color: #FFFDF9;
    }

    .alpha-btn.all-btn {
      width: auto;
      padding: 0 12px;
      border-radius: 16px;
      font-size: 0.9rem;
      border-color: var(--border-line);
    }

    /* Main Grid */
    main {
      max-width: 1100px;
      margin: 3rem auto;
      padding: 0 1.5rem 5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2.2rem;
    }

    .lexicon-card {
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .lexicon-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(31, 28, 24, 0.08);
    }

    .card-image-wrap {
      position: relative;
      height: 200px;
      overflow: hidden;
      background: #2C2621;
    }

    .card-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: sepia(0.35) contrast(1.05);
      transition: transform 0.5s ease;
    }

    .lexicon-card:hover .card-image-wrap img {
      transform: scale(1.05);
    }

    .letter-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 38px;
      height: 38px;
      background: var(--accent-crimson);
      color: #FFF;
      font-size: 1.35rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .card-body {
      padding: 1.6rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .word-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.2rem;
    }

    .word-title {
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--ink-primary);
      letter-spacing: 0.02em;
    }

    .audio-btn {
      background: transparent;
      border: 1px solid var(--border-line);
      color: var(--accent-crimson);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
      font-family: 'Noto Serif TC', serif;
    }

    .audio-btn:hover {
      background: var(--accent-crimson);
      color: #FFF;
    }

    .phonetic {
      font-size: 0.95rem;
      color: var(--ink-secondary);
      font-style: italic;
      margin-bottom: 0.8rem;
    }

    .meaning {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent-crimson);
      margin-bottom: 0.6rem;
    }

    .nuance {
      font-size: 0.95rem;
      color: var(--ink-secondary);
      margin-bottom: 1.2rem;
    }

    .quote-box {
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px dashed var(--border-line);
    }

    .quote-en {
      font-style: italic;
      font-size: 1.08rem;
      color: var(--ink-primary);
      margin-bottom: 0.4rem;
    }

    .quote-zh {
      font-size: 0.92rem;
      color: var(--ink-secondary);
      margin-bottom: 0.5rem;
    }

    .quote-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--accent-gold);
      font-weight: 600;
    }

    .quote-play {
      background: none;
      border: none;
      color: var(--accent-crimson);
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid var(--border-line);
      color: var(--ink-secondary);
      font-size: 0.9rem;
    }
  </style>
</head>
